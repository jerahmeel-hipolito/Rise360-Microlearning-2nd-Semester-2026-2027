<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Course Portal — Courses</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/portal.css">
</head>
<body>

  <header class="site-header">
    <div class="shell">
      <div class="brand">Microlearning <span class="brand-mark">Portal</span></div>
      <div class="student-chip">
        <span id="student-id-display">—</span>
        <button id="sign-out-btn" type="button">Not you?</button>
      </div>
    </div>
  </header>

  <main>
    <div class="shell">
      <div class="page-title-row">
        <h1>Your courses</h1>
      </div>

      <div class="course-preview-grid" id="course-preview-grid">
        <!-- populated by JS from CourseCatalog -->
      </div>
    </div>
  </main>

  <footer class="site-footer">
    <div class="shell">Microlearning Portal · 2nd Semester, SY 2026–2027 · lessons are released weekly</div>
  </footer>

  <script src="js/storage.js"></script>
  <script src="js/releases.js"></script>
  <script src="js/course-catalog.js"></script>
  <script>
    (function () {
      const studentId = Storage.getStudentId();
      if (!studentId) {
        window.location.href = 'index.html';
        return;
      }
      document.getElementById('student-id-display').textContent = studentId;

      document.getElementById('sign-out-btn').addEventListener('click', function () {
        Storage.clearStudentId();
        window.location.href = 'index.html';
      });

      // Each course links out to its own dedicated course-<id>.html detail
      // page (see PROJECT_CONTINUITY.md) rather than expanding its full
      // chapter/lesson list inline here — this page's job is just "which
      // course", the detail page's job is "which lesson".
      function pageFor(course) { return 'course-' + course.courseId + '.html'; }

      // Local completion count restricted to RELEASED lessons (placeholders
      // can't be completed, so they must not count toward progress).
      function completedReleased(course) {
        let n = 0;
        course.chapters.forEach(function (ch) {
          ch.lessons.forEach(function (l) {
            if (l.released && Storage.isLessonCompletedLocally(course.courseId, ch.chapterId, l.lessonNum)) n++;
          });
        });
        return n;
      }

      const grid = document.getElementById('course-preview-grid');

      // Small white line drawings, one per course, shown faintly in the card band.
      const MOTIFS = {
        bst305: '<path d="M10 100 C60 100 70 28 120 28 C170 28 180 100 230 100" fill="rgba(255,255,255,0.12)" stroke="currentColor" stroke-width="1.5"/><line x1="120" y1="28" x2="120" y2="100" stroke="currentColor" stroke-dasharray="3 3" stroke-width="1"/><line x1="0" y1="100" x2="240" y2="100" stroke="currentColor" stroke-width="1"/>',
        mas204a: '<line x1="20" y1="104" x2="230" y2="22" stroke="currentColor" stroke-width="1.5"/><g fill="currentColor"><circle cx="40" cy="92" r="2.6"/><circle cx="68" cy="84" r="2.6"/><circle cx="92" cy="80" r="2.6"/><circle cx="118" cy="62" r="2.6"/><circle cx="146" cy="66" r="2.6"/><circle cx="170" cy="48" r="2.6"/><circle cx="196" cy="40" r="2.6"/><circle cx="220" cy="34" r="2.6"/></g>',
        mas308: '<g fill="none" stroke="currentColor" stroke-width="1"><rect x="110" y="18" width="120" height="86"/><line x1="150" y1="18" x2="150" y2="104"/><line x1="190" y1="18" x2="190" y2="104"/><line x1="110" y1="47" x2="230" y2="47"/><line x1="110" y1="76" x2="230" y2="76"/></g><g fill="rgba(255,255,255,0.28)"><rect x="110" y="18" width="40" height="29"/><rect x="150" y="47" width="40" height="29"/><rect x="190" y="76" width="40" height="28"/></g>'
      };

      function esc(t) {
        return String(t).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
      }

      function lessonUrl(course, ch, l) {
        return 'courses/' + course.courseId + '/chapter-' + ch.chapterId + '/' + l.lessonId + '/';
      }

      // NOTE: progress here is a cosmetic, LOCAL-ONLY convenience for the
      // student's own browser. The instructor's Dashboard sheet remains the
      // source of truth.
      CourseCatalog.forEach(function (course) {
        const total = course.totalLessons;
        const released = course.releasedLessons;
        const chapterCount = course.chapters.length;

        let strip = '';
        let completed = 0;
        let nextUp = null;
        course.chapters.forEach(function (ch) {
          ch.lessons.forEach(function (l) {
            const done = l.released && Storage.isLessonCompletedLocally(course.courseId, ch.chapterId, l.lessonNum);
            if (done) completed++;
            if (l.released && !done && !nextUp) nextUp = { ch: ch, l: l };
            strip += '<li class="' + (done ? 'done' : (l.released ? 'released' : '')) + '"></li>';
          });
        });

        let nextHtml, ctaText, ctaHref;
        if (nextUp) {
          nextHtml = (completed > 0 ? 'Continue with' : 'Start with') +
            '<strong>' + esc(nextUp.l.lessonTitle) + '</strong>';
          ctaText = completed > 0 ? 'Continue' : 'Start course';
          ctaHref = lessonUrl(course, nextUp.ch, nextUp.l);
        } else if (released > 0) {
          nextHtml = 'You are caught up.<strong>New lessons open weekly</strong>';
          ctaText = 'Review lessons';
          ctaHref = pageFor(course);
        } else {
          nextHtml = 'Lessons open soon.<strong>Check back weekly</strong>';
          ctaText = 'View outline';
          ctaHref = pageFor(course);
        }

        const card = document.createElement('div');
        card.className = 'course-preview-card';
        card.innerHTML =
          '<div class="preview-card-band" data-course="' + course.courseId + '">' +
            '<svg class="preview-motif" viewBox="0 0 240 116" preserveAspectRatio="xMaxYMid slice" aria-hidden="true" focusable="false" style="opacity:.35">' + (MOTIFS[course.courseId] || '') + '</svg>' +
            '<span class="preview-course-code">' + esc(course.courseNumber) + '</span>' +
          '</div>' +
          '<div class="preview-card-body">' +
            '<h2>' + esc(course.courseName) + '</h2>' +
            '<p class="preview-course-desc">' + esc(course.courseDescription) + '</p>' +
            '<ul class="lesson-strip" aria-hidden="true">' + strip + '</ul>' +
            '<div class="preview-meta-row">' +
              '<span>' + released + ' of ' + total + ' lessons open</span>' +
              '<span>' + chapterCount + ' chapters</span>' +
            '</div>' +
            '<div class="preview-next">' + nextHtml + '</div>' +
            '<div class="preview-actions">' +
              '<a class="btn-continue" href="' + ctaHref + '">' + ctaText + '</a>' +
              '<a class="btn-all-lessons" href="' + pageFor(course) + '">All lessons</a>' +
            '</div>' +
          '</div>';

        grid.appendChild(card);
      });
    })();
  </script>
</body>
</html>
